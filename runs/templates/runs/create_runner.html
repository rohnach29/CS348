{% extends 'runs/base.html' %}

{% block title %}Create Runner Profile | Runner Tracker{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h4>Create Your Runner Profile</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="bio" class="form-label">Bio</label>
                        <textarea name="bio" id="bio" class="form-control" rows="3" placeholder="Tell us about yourself as a runner..."></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" name="age" id="age" class="form-control" min="1" max="120">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="height_cm" class="form-label">Height (cm)</label>
                            <input type="number" name="height_cm" id="height_cm" class="form-control" min="1" max="300">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="weight_kg" class="form-label">Weight (kg)</label>
                            <input type="number" name="weight_kg" id="weight_kg" class="form-control" min="1" max="500" step="0.1">
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Create Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
