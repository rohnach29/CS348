{% extends 'runs/base.html' %}

{% block title %}Logged Out | Runner Tracker{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h4>Logged Out</h4>
            </div>
            <div class="card-body text-center">
                <p class="mb-4">You have been successfully logged out.</p>
                <a href="{% url 'login' %}" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt me-1"></i> Log In Again
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
